{% extends 'main.html' %}
{% block content%}

<!-- Main Section -->
<main class="formPage my-xl">
  <div class="content-box">
    <div class="formWrapper">
      <a class="backButton" href="{% url 'account' %}"><i class="fa fa-angle-left"></i></a>
      <br>

      <form class="form" method="POST">
        {% csrf_token %}
        <p>Are you sure you want to delete your {{ project.title }} project?</p>
        <a class="btn btn--sub btn--lg  my-md" href="{{ request.GET.next }}">&#x2190 Go Back</a>
        <input class="btn btn--sub btn--lg  my-md" type="submit" value="Delete" />
      </form>
    </div>
  </div>
</main>
{% endblock %}
